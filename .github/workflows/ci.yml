name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Go version is sourced from go.mod (go-version-file) so CI tracks the
# module's required version automatically.

jobs:
  lint-test:
    name: Lint & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Verify gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "::error::The following files are not gofmt-formatted:"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: Test
        # -short skips the environment-sensitive NFR latency-percentile guard
        # (TestLoad_P99LatencyUnderConcurrency); correctness, concurrency, leak,
        # and degradation tests all still run. Validate NFR figures locally with
        # `make nfr` on controlled hardware.
        run: go test ./... -race -short -count=1 -timeout 5m

  vulncheck:
    name: Vulnerability scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          "$(go env GOPATH)/bin/govulncheck" ./...
