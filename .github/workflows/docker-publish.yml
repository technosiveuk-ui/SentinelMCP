# Build and publish the sidecar image to GitHub Container Registry.
#
# Triggers:
#   - push of a version tag (v*)  → tags the image with the semver + `latest`
#   - workflow_dispatch           → manual run to (re)publish, e.g. backfilling
#
# The image backs the "Proxy Mode" quickstart in the README
# (ghcr.io/technosiveuk-ui/sentinelmcp:latest), so the documented
# `docker run` one-liner works out of the box.

name: docker-publish

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/technosiveuk-ui/sentinelmcp
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
            type=sha,prefix=sha-,format=short

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
