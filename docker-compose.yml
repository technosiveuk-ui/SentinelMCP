# SentinelMCP Docker Demo
#
# One-command demo: docker compose up --build --abort-on-container-exit
#
# Flow:
#   1. upstream starts on :3001 with 3 demo tools
#   2. sidecar discovers tools, starts proxy on :8080, admin on :9090
#   3. test-client runs all 3 enforcement flows and exits 0/1

services:
  upstream:
    build:
      context: .
      dockerfile: Dockerfile.upstream
    ports:
      - "3001:3001"
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "3001"]
      interval: 2s
      timeout: 3s
      retries: 15
      start_period: 3s

  sidecar:
    build:
      context: .
      dockerfile: Dockerfile
    # Both the admin server (:9090) and the MCP proxy (:8080) bind all
    # interfaces so the test-client container (a separate network namespace) can
    # reach them. Non-loopback binds are fail-closed by default, so the demo
    # passes --insecure-admin-bind (admin: needs admin_token below) and
    # --insecure-dev-mode (MCP proxy: plaintext, no auth). Private compose
    # network only — never do this in production.
    command: ["-config", "/etc/sentinelmcp/config.yaml", "--insecure-admin-bind", "--insecure-dev-mode"]
    ports:
      - "8080:8080"
      - "9090:9090"
    depends_on:
      upstream:
        condition: service_healthy
    environment:
      - SENTINELMCP_CONFIG=/etc/sentinelmcp/config.yaml
      # Shared demo token. Injected via env (not baked into the image/config) so
      # the secret never lives in the layered filesystem. The test-client below
      # receives the same value so it can authenticate resume calls.
      - SENTINELMCP_ADMIN_TOKEN=demo-admin-token-change-me
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:9090/healthz"]
      interval: 2s
      timeout: 3s
      retries: 10
      start_period: 5s

  test-client:
    build:
      context: .
      dockerfile: Dockerfile.testclient
    depends_on:
      sidecar:
        condition: service_healthy
    environment:
      - SENTINELMCP_URL=http://sidecar:8080/mcp
      - SENTINELMCP_ADMIN_URL=http://sidecar:9090
      - SENTINELMCP_ADMIN_TOKEN=demo-admin-token-change-me
