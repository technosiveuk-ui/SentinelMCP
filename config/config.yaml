# SentinelMCP — Default Policy Configuration
# See docs/designs/2026-06-11-core-interfaces-and-dsl.md for full schema docs.

schema_version: "1.0"

# ---------------------------------------------------------------------------
# Structured logging (log/slog)
# ---------------------------------------------------------------------------
# Output always goes to stderr so it never collides with the JSON audit stream
# on stdout. format "text" (default) is human-readable and greppable; set
# "json" when shipping to a log aggregator (Loki/ELK/Splunk). level defaults to
# info; set debug for verbose startup/tool-registration output.
log:
  format: "text"   # "text" | "json"
  level: "info"    # "debug" | "info" | "warn" | "error"

global:
  default_risk: low
  audit_output: stdout
  redaction_mask: "***REDACTED***"
  default_dlp_patterns:
    - PRIVATE_KEY
    - PASSWORD
  policy_defaults:
    low: allow
    medium: redact
    high: interrupt_for_approval

tools:
  echo_message:
    risk: low

  filesystem_read:
    risk: medium
    redact_patterns:
      - PRIVATE_KEY
      - PASSWORD
      - API_KEY

  filesystem_write:
    risk: high
    require_approval: true
    approval_reason: "File write operations can cause data loss"
    redact_patterns:
      - PRIVATE_KEY
      - PASSWORD
      - CREDIT_CARD

  exec_command:
    risk: high
    require_approval: true
    approval_reason: "Shell commands can modify system state"
    redact_patterns:
      - PRIVATE_KEY
      - PASSWORD
      - CREDIT_CARD

  calculator:
    risk: medium
    redact_patterns:
      - PRIVATE_KEY
      - PASSWORD

  "db_*":
    risk: high
    require_approval: true
    approval_reason: "Database operations require approval"

dlp_patterns: {}
  # Built-in patterns (PRIVATE_KEY, PASSWORD, API_KEY, CREDIT_CARD, SSN, EMAIL,
  # AWS_ACCESS_KEY, GITHUB_TOKEN, PHONE) are available by default. Add custom
  # patterns here:
  #
  # INTERNAL_HOSTNAME:
  #   regex: '\b[a-z]+\.internal\.company\.com\b'
  #   type: pii

# ---------------------------------------------------------------------------
# Action-based policies (compose with the risk model above)
# ---------------------------------------------------------------------------
# When present, rules are evaluated first-match-wins: a rule matches a tool when
# its `tools` glob matches AND, if `risk` is set, the call's risk is at least
# that level. The first matching rule's `action` drives enforcement; tools no
# rule matches fall through to the risk model above (low->allow, medium->redact,
# high->interrupt). A catch-all tools:["*"] rule must be LAST or it shadows
# later rules. Hot-reloaded on config change; a bad file is rejected and the
# previous policy is kept (fail-closed).
#
# policies:
#   - name: "block-file-ops"
#     tools: ["fs_*"]
#     action: BLOCK
#   - name: "approve-destructive"
#     tools: ["db_drop*", "db_delete*"]
#     action: INTERRUPT
#     timeout: 300s          # overrides the global interrupt timeout
#   - name: "redact-pii"
#     tools: ["*"]           # catch-all — keep last
#     action: REDACT
#     inspection: [pii, secrets]  # DLP categories (used by the inspection layer)

# ---------------------------------------------------------------------------
# Sidecar proxy configuration (Phase 2)
# ---------------------------------------------------------------------------

sidecar:
  listen_addr: "localhost:8080"
  transport: "streamable_http"       # "stdio" | "streamable_http"
  strict: true                       # reject http:// + IP-literal upstreams at load (fail-closed); false only for trusted private-network upstreams
  # Egress allowlist: when non-empty, every upstream host must match (hostname
  # suffix or exact IP). Empty = no egress restriction (warns under strict).
  #   egress_allowlist: [".internal.company.com", "10.0.0.5"]
  egress_allowlist: []
  health_addr: "localhost:9090"
  # Gates the privileged /api/v1/approval/resume endpoint. Required when
  # health_addr is non-loopback (fail-closed). Prefer the SENTINELMCP_ADMIN_TOKEN
  # env var over placing the secret here; if set in this file, the file must be
  # mode 0600 (the loader refuses group/world-readable configs carrying it).
  admin_token: ""
  checkpoint_path: "./sentinelmcp-checkpoints.db"
  # Inbound TLS for the MCP proxy. Opt-in on loopback; REQUIRED when listen_addr
  # is non-loopback (fail-closed). Generate a self-signed cert for testing with:
  #   openssl req -x509 -newkey rsa:2048 -keyout key.pem -out cert.pem -days 365 -nodes
  tls:
    cert_file: ""
    key_file: ""
  upstream_servers: []
    # - name: "echo"
    #   url: "https://echo.local/mcp"
    #   credentials_ref: "echo"   # resolved via secrets (file or SENTINELMCP_UPSTREAM_ECHO_TOKEN)
    # - name: "filesystem"
    #   url: "https://fs.local/mcp"

# ---------------------------------------------------------------------------
# Inbound authentication (API keys)
# ---------------------------------------------------------------------------
# When non-empty, every inbound MCP call must present a valid key via
# "Authorization: Bearer <key>" or "X-API-Key: <key>". Required when listen_addr
# is non-loopback (fail-closed). If set in this file, it must be mode 0600.
auth:
  api_keys: {}
    # "key-123": "alice"   # key -> principal
    # "key-456": "bob"

# ---------------------------------------------------------------------------
# Outbound credentials (upstream authentication)
# ---------------------------------------------------------------------------
# Upstreams that require auth declare credentials_ref; SentinelMCP resolves it
# from a mode-0600 secrets file (below) or the env var
# SENTINELMCP_UPSTREAM_<KEY>_TOKEN. Fail-closed: an unresolved credentials_ref
# blocks the upstream entirely. A secrets.yaml looks like:
#   upstreams:
#     echo:
#       headers:
#         Authorization: "Bearer <token>"
secrets:
  provider: "file"            # OSS file/env provider; Enterprise overrides in SentinelENT
  file: ""                    # e.g. "./secrets.yaml" (must be mode 0600); empty = env-only

# ---------------------------------------------------------------------------
# SIEM audit sinks (Phase 2)
# ---------------------------------------------------------------------------

siem:
  sinks: []
    # - type: "file"
    #   path: "/var/log/sentinelmcp/audit.jsonl"
    #   max_size_mb: 100
    #   max_backups: 5
    #   compress: true
    # - type: "splunk_hec"
    #   endpoint: "https://splunk.example.com:8088/services/collector"
    #   token: "${SPLUNK_HEC_TOKEN}"

# ---------------------------------------------------------------------------
# OpenTelemetry metrics (Phase 2)
# ---------------------------------------------------------------------------

otel:
  enabled: false
  endpoint: "localhost:4317"
  service_name: "sentinelmcp"
  export_interval: "15s"

# ---------------------------------------------------------------------------
# Approval provider (Phase 2)
# ---------------------------------------------------------------------------

approval:
  provider: "cli"                    # "cli" | "webhook"
  # Fallback deadline for an approval interrupt when the matching policy rule
  # sets no per-rule `timeout`. Empty => the built-in 10m cap. Every interrupt
  # gets a finite deadline — an unbounded wait is auto-blocked (fail-closed).
  # A policy rule's `timeout` overrides this per-tool. Startup-time setting.
  default_timeout: ""
  webhook:
    url: ""                          # set to enable webhook HITL
    resume_base_url: "http://localhost:9090"
